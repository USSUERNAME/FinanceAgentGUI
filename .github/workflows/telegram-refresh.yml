name: Telegram intelligence refresh
run-name: Telegram refresh · ${{ github.event_name }} · ${{ github.run_id }}

on:
  workflow_dispatch:
  schedule:
    # Every three hours at :17 UTC. This avoids the weekday 22:30 UTC full brief.
    - cron: "17 */3 * * *"

permissions:
  contents: read
  deployments: write

concurrency:
  group: telegram-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline/pb-daily-market-brief
    env:
      BRIEF_TIMEZONE: Asia/Seoul
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
    steps:
      - name: Check out private brief code
        uses: actions/checkout@v4

      - name: Restore sanitized private-reader history
        if: vars.CLOUDFLARE_REPORTS_PROTECTED == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .reader-public-history/reports.json
          key: private-reader-history-${{ github.run_id }}
          restore-keys: |
            private-reader-history-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pb-daily-market-brief/requirements.txt

      - name: Install collection dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore latest Telegram intelligence
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: pipeline/pb-daily-market-brief/workspace/telegram_refresh
          key: ${{ runner.os }}-telegram-refresh-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-telegram-refresh-v1-

      - name: Restore latest verified stock reader inputs
        if: vars.CLOUDFLARE_REPORTS_PROTECTED == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/pb-daily-market-brief/workspace/company_long_term_profiles
            pipeline/pb-daily-market-brief/workspace/us_equity_candidate_screen
          key: ${{ runner.os }}-stock-reader-inputs-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-stock-reader-inputs-v1-

      - name: Collect and cluster Telegram intelligence
        id: refresh
        run: python refresh_telegram_intelligence.py

      - name: Validate collection result
        id: validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              Path("workspace/telegram_refresh").glob("*/telegram_intelligence.json"),
              key=lambda path: path.stat().st_mtime,
          )
          if not files:
              raise SystemExit("Telegram refresh did not create a payload")
          payload = json.loads(files[-1].read_text(encoding="utf-8"))
          if payload.get("schema_version") != "telegram_intelligence_refresh.v1":
              raise SystemExit("Telegram refresh payload schema is invalid")
          if payload.get("status") not in {"ok", "partial"}:
              raise SystemExit(
                  "Telegram refresh produced no usable posts; check the session and channel access"
              )
          print(f"Validated {files[-1]}")
          PY

      - name: Write collection summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          files = sorted(
              Path("workspace/telegram_refresh").glob("*/telegram_intelligence.json"),
              key=lambda path: path.stat().st_mtime,
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not files:
              summary.write_text("### Telegram refresh\n- No refresh payload was created.\n", encoding="utf-8")
              raise SystemExit(0)
          payload = json.loads(files[-1].read_text(encoding="utf-8"))
          lines = [
              "### Telegram refresh",
              f"- Status: {payload.get('status', 'unknown')}",
              f"- Generated at: {payload.get('generated_at', 'unknown')}",
              f"- Raw posts: {payload.get('raw_post_count', 0)}",
              f"- Event clusters: {payload.get('event_cluster_count', 0)}",
              f"- Channels represented: {payload.get('represented_channel_count', 0)}",
              f"- PDF approval candidates: {payload.get('pdf_attachment_count', 0)}",
          ]
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Set up Node for private reader
        if: steps.validate.outcome == 'success' && vars.CLOUDFLARE_REPORTS_PROTECTED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate previous private-reader bundle
        if: steps.validate.outcome == 'success' && vars.CLOUDFLARE_REPORTS_PROTECTED == 'true'
        working-directory: .
        run: |
          node -e "const fs=require('fs'); const p='.reader-public-history/reports.json'; if(!fs.existsSync(p)) throw new Error('Previous private-reader bundle is missing; refusing to replace report history'); const v=JSON.parse(fs.readFileSync(p,'utf8')); if(v.schemaVersion!=='public_pb_reader_bundle.v1') throw new Error('Previous private-reader bundle is invalid');"

      - name: Build private reader with latest Telegram monitor
        if: steps.validate.outcome == 'success' && vars.CLOUDFLARE_REPORTS_PROTECTED == 'true'
        working-directory: .
        run: |
          node scripts/build-public-report-reader.mjs \
            --input pipeline/pb-daily-market-brief/workspace/v2_reader_reports \
            --intelligence pipeline/pb-daily-market-brief/workspace/intelligence \
            --companies pipeline/pb-daily-market-brief/workspace/company_long_term_profiles \
            --candidate-screens pipeline/pb-daily-market-brief/workspace/us_equity_candidate_screen \
            --telegram pipeline/pb-daily-market-brief/workspace/telegram_refresh \
            --output .generated/cloudflare-report-reader \
            --previous .reader-public-history/reports.json

      - name: Validate stock gate and performance observation
        if: steps.validate.outcome == 'success' && vars.CLOUDFLARE_REPORTS_PROTECTED == 'true'
        working-directory: .
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '.generated/cloudflare-report-reader/reports.json';
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (payload.schemaVersion !== 'public_pb_reader_bundle.v1') {
            throw new Error('Private reader bundle schema is invalid');
          }
          if (!Array.isArray(payload.companies) || !Array.isArray(payload.candidatePerformance)) {
            throw new Error('Stock gate or performance observation is missing');
          }
          const latest = payload.companies[0] || {};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '',
            '### Stock gate observation',
            `- Latest gate date: ${latest.reportDate || 'pending first daily run'}`,
            `- Verified profiles: ${Number(latest.profileCount || 0)}`,
            `- C-grade watch candidates: ${Number(latest.pendingCount || 0)}`,
            `- Performance series: ${payload.candidatePerformance.length}`,
            '',
          ].join('\n'));
          NODE

      - name: Deploy Telegram monitor to Cloudflare Pages
        id: deploy_private_reader
        if: steps.validate.outcome == 'success' && vars.CLOUDFLARE_REPORTS_PROTECTED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .generated/cloudflare-report-reader --project-name=finance-agent-reports --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve updated private-reader history
        if: steps.deploy_private_reader.outcome == 'success'
        working-directory: .
        run: cp .generated/cloudflare-report-reader/reports.json .reader-public-history/reports.json

      - name: Save updated private-reader history
        if: steps.deploy_private_reader.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .reader-public-history/reports.json
          key: private-reader-history-${{ github.run_id }}

      - name: Preserve Telegram refresh artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-intelligence-${{ github.run_id }}
          path: pipeline/pb-daily-market-brief/workspace/telegram_refresh/
          if-no-files-found: warn
          retention-days: 14

      - name: Save latest Telegram intelligence
        if: steps.validate.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: pipeline/pb-daily-market-brief/workspace/telegram_refresh
          key: ${{ runner.os }}-telegram-refresh-v1-${{ github.run_id }}
